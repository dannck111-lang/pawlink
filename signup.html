<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <title>Get Started — PawLink</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="onboarding.css">
  <script src="app.js" defer></script>
  <script src="signup-verification.js?v=1" defer></script>
</head>
<body>
  <main class="auth-layout">
    <aside class="auth-aside">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">🐾</span><span>Paw<span class="brand-accent">Link</span></span></a>
      <div class="auth-aside-copy"><h1>Good things happen when we connect.</h1><p>Join neighbors and pet lovers making it easier for every animal to find safety, care, and home.</p></div>
      <div class="auth-aside-art" aria-hidden="true">🐾</div>
    </aside>
    <section class="auth-main" aria-labelledby="signup-title">
      <div class="auth-card">
        <a class="back-link" href="index.html">← Back to home</a>
        <h2 id="signup-title">Join the PawLink community</h2>
        <p class="auth-subtitle">Tell us a little about yourself to get started.</p>
        <form data-auth-form="signup" novalidate>
          <label class="form-field"><span>Full name</span><input type="text" name="name" autocomplete="name" placeholder="Alex Morgan" required></label>
          <div class="form-row">
            <label class="form-field"><span>Email address</span><input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label>
            <label class="form-field"><span>Phone number</span><input type="tel" name="phone" autocomplete="tel" placeholder="(555) 123-4567" required></label>
          </div>
          <div class="form-row">
            <label class="form-field"><span>Age</span><input type="number" name="age" min="13" max="120" inputmode="numeric" placeholder="Your age" required></label>
            <label class="form-field"><span>City / Area</span><input type="text" name="city" autocomplete="address-level2" placeholder="Your neighborhood" required></label>
          </div>
          <label class="form-field"><span>I'm here to...</span><select name="primaryInterest" required><option value="" disabled selected>Choose what interests you</option><option value="adoption">Adopt a pet</option><option value="lost-found">Report a lost or found pet</option><option value="community">Connect with the community</option><option value="shop">Shop or sell pet items</option><option value="donate">Support local pets</option></select></label>
          <label class="form-field"><span>Password</span><input type="password" name="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required></label>
          <label class="form-field"><span>Valid ID image <b aria-hidden="true">(required)</b></span><input type="file" name="idVerification" accept="image/jpeg,image/png,image/webp" required aria-describedby="id-verification-note id-verification-error"><small id="id-verification-note">Upload a clear image of a valid ID (JPG, PNG, or WebP; up to 5 MB). This demo checks the file only—it does not send or verify your ID. Do not upload sensitive ID documents until secure verification is available.</small></label>
          <p class="form-error" data-id-verification-error id="id-verification-error" role="alert" aria-live="polite"></p>
          <p class="form-error" data-form-error role="alert" aria-live="polite"></p>
          <button class="button button-primary auth-submit" type="submit">Create Account <span aria-hidden="true">→</span></button>
        </form>
        <p class="auth-footnote">Already have an account? <a href="login.html">Log in</a></p>
        <p class="auth-footnote signup-theme"><button class="icon-button theme-toggle" type="button" aria-label="Switch to dark mode"><span data-theme-icon aria-hidden="true">☾</span></button></p>
      </div>
    </section>
  </main>
</body>
</html>
