<main class="app-main"><div class="app-content"><header class="page-heading profile-heading"><div class="profile-heading-avatar user-avatar" data-user-initial>P</div><div><p class="home-eyebrow">Your PawLink account</p><h1 data-user-name>My profile</h1><p data-user-email></p></div></header><div class="profile-tabs" role="tablist"><button type="button" role="tab" class="profile-tab is-active" data-profile-tab="details">Profile details</button><button type="button" role="tab" class="profile-tab" data-profile-tab="contributions">My contributions</button></div><section data-profile-panel="details" class="profile-panel"><form class="profile-form" data-profile-form><h2>Personal information</h2><p class="muted-copy">Your profile details help neighbors and local rescues connect with you.</p><div class="form-row"><label class="form-field"><span>Full name</span><input name="name" autocomplete="name" required></label><label class="form-field"><span>Email address</span><input name="email" type="email" autocomplete="email" required></label></div><div class="form-row"><label class="form-field"><span>Phone number</span><input name="phone" type="tel" autocomplete="tel"></label><label class="form-field"><span>Age</span><input name="age" type="number" min="13" max="120"></label></div><label class="form-field"><span>City / Area</span><input name="city" autocomplete="address-level2"></label><p class="form-error" data-form-error role="alert"></p><button class="button button-primary" type="submit">Save profile</button></form></section><section data-profile-panel="contributions" class="profile-panel" hidden><div class="contributions-list" data-contributions></div></section></div></main></body></html>
