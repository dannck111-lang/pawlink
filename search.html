<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8fafc">
  <title>Search Pets — PawLink</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app-pages.css"><script src="app.js" defer></script>
</head>
<body class="app-shell">
  <header class="mobile-topbar"><a class="brand" href="dashboard.html"><span class="brand-mark" aria-hidden="true">🐾</span><span>Paw<span class="brand-accent">Link</span></span></a><div class="mobile-bar-actions"><button class="icon-button theme-toggle" type="button"><span data-theme-icon aria-hidden="true">☾</span></button><button class="icon-button menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="app-sidebar">☰</button></div></header><button class="drawer-backdrop" type="button" aria-label="Close navigation menu"></button>
  <aside class="sidebar" id="app-sidebar" aria-label="App navigation"><a class="brand" href="dashboard.html"><span class="brand-mark" aria-hidden="true">🐾</span><span>Paw<span class="brand-accent">Link</span></span></a><p class="sidebar-label">Workspace</p><nav class="sidebar-nav"><a href="dashboard.html"><span class="nav-icon">⌂</span>Home</a><a href="search.html" aria-current="page"><span class="nav-icon">⌕</span>Search pets</a><a href="adopt.html"><span class="nav-icon">♡</span>Adopt a pet</a><a href="profile.html"><span class="nav-icon">◉</span>My profile</a></nav><div class="sidebar-bottom"><button class="sidebar-action theme-toggle" type="button"><span class="nav-icon" data-theme-icon>☾</span>Toggle theme</button><div class="sidebar-user"><span class="user-avatar" data-user-initial aria-hidden="true">P</span><span><strong data-user-name>Pet lover</strong><small data-user-email></small></span></div><button class="sidebar-action" type="button" data-sign-out><span class="nav-icon">↪</span>Log out</button></div></aside>
  <main class="app-main"><div class="app-content"><header class="page-heading"><div><p class="home-eyebrow">Discover nearby</p><h1>Find a pet who needs you</h1><p>Search local pets, adoption listings, and community reports.</p></div></header>
    <section class="search-panel" aria-label="Search and filter pets"><label class="search-input-wrap"><span aria-hidden="true">⌕</span><input type="search" placeholder="Search by name, breed, or location..." aria-label="Search pets" data-search-input></label>
      <div class="filter-chips" role="group" aria-label="Filter by category"><button type="button" class="filter-chip is-active" data-category-chip="all">All pets</button><button type="button" class="filter-chip" data-category-chip="adoption">Adoption</button><button type="button" class="filter-chip" data-category-chip="lost &amp; found">Lost &amp; found</button></div>
      <div class="filter-selects"><label><span>Category</span><select data-filter-category><option value="all">All categories</option><option value="adoption">Adoption</option><option value="lost &amp; found">Lost &amp; found</option></select></label><label><span>Location</span><select data-filter-location><option value="">All locations</option><option value="oakland">Oakland</option><option value="berkeley">Berkeley</option><option value="san francisco">San Francisco</option><option value="richmond">Richmond</option><option value="alameda">Alameda</option><option value="emeryville">Emeryville</option></select></label><label><span>Species</span><select data-filter-species><option value="">All species</option><option value="dog">Dogs</option><option value="cat">Cats</option></select></label></div>
    </section><div class="results-heading"><h2>Pets near you</h2><span data-search-count aria-live="polite">0 pets found</span></div><div class="pet-grid" data-pet-grid></div><p class="empty-state" data-no-results hidden>No pets match these filters. Try changing your search.</p>
  </div></main>
</body>
</html>
