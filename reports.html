<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>Community Reports — PawLink</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app-pages.css"><link rel="stylesheet" href="community-pages.css?v=3"><script src="app.js" defer></script></head>
<body class="app-shell"><header class="mobile-topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">🐾</span><span>Paw<span class="brand-accent">Link</span></span></a><div class="mobile-bar-actions"><button class="icon-button theme-toggle" type="button"><span data-theme-icon>☾</span></button><button class="icon-button menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="app-sidebar">☰</button></div></header><button class="drawer-backdrop" type="button" aria-label="Close navigation menu"></button>
<aside class="sidebar" id="app-sidebar" aria-label="App navigation"><a class="brand" href="dashboard.html"><span class="brand-mark">🐾</span><span>Paw<span class="brand-accent">Link</span></span></a><p class="sidebar-label">Workspace</p><nav class="sidebar-nav"><a href="dashboard.html"><span class="nav-icon">⌂</span>Home</a><a href="search.html"><span class="nav-icon">⌕</span>Search pets</a><a href="reports.html" aria-current="page"><span class="nav-icon">▤</span>Community reports</a><a href="adopt.html"><span class="nav-icon">♡</span>Adopt a pet</a><a href="shop.html"><span class="nav-icon">▧</span>Pet shop</a><a href="donate.html"><span class="nav-icon">♥</span>Donate</a><a href="profile.html"><span class="nav-icon">◉</span>My profile</a></nav><div class="sidebar-bottom"><button class="sidebar-action theme-toggle" type="button"><span class="nav-icon" data-theme-icon>☾</span>Toggle theme</button><div class="sidebar-user"><span class="user-avatar" data-user-initial>P</span><span><strong data-user-name>Pet lover</strong><small data-user-email></small></span></div><button class="sidebar-action" type="button" data-sign-out><span class="nav-icon">↪</span>Log out</button></div></aside>
<main class="app-main"><div class="app-content"><header class="page-heading"><p class="home-eyebrow">Neighbors helping neighbors</p><h1>Community reports</h1><p>Share a sighting, ask for help, and celebrate the little wins.</p></header><section class="composer-prompt"><span class="user-avatar" data-user-initial>P</span><button type="button" data-open-post>Share an update with your community...</button></section><div class="feed-list" data-post-feed aria-live="polite"></div></div></main>
<dialog class="inquiry-dialog post-dialog" data-post-dialog aria-labelledby="post-modal-title"><form method="dialog" class="dialog-dismiss"><button type="submit" class="dialog-x" aria-label="Close">×</button></form><p class="home-eyebrow">PawLink community</p><h2 data-post-modal-title>Create a community post</h2><form data-post-form><input type="hidden" name="postId"><label class="form-field"><span>Report tag</span><select name="tag"><option>Community update</option><option>Lost pet</option><option>Found pet</option><option>Pet sighting</option><option>Reunion</option><option>Rescue help</option></select></label><label class="form-field"><span>Your caption</span><textarea name="caption" rows="4" maxlength="1200" required placeholder="What would you like your neighbors to know?"></textarea></label><label class="form-field"><span>Image URL (optional)</span><input type="url" name="imageUrl" placeholder="https://..."></label><label class="form-field"><span>Or upload an image (under 900 KB)</span><input type="file" name="imageFile" accept="image/*"></label><p class="form-error" data-form-error role="alert"></p><div class="dialog-actions"><button class="button button-outline" type="button" data-close-post>Cancel</button><button class="button button-primary" type="submit">Publish post</button></div></form></dialog></body></html>
