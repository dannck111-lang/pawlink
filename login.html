<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <title>Log In — PawLink</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="auth-layout">
    <aside class="auth-aside">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">🐾</span><span>Paw<span class="brand-accent">Link</span></span></a>
      <div class="auth-aside-copy"><h1>Welcome back, friend.</h1><p>Your PawLink community is here for every lost-and-found, every helping hand, and every new beginning.</p></div>
      <div class="auth-aside-art" aria-hidden="true">🐾</div>
    </aside>
    <section class="auth-main" aria-labelledby="login-title">
      <div class="auth-card">
        <a class="back-link" href="index.html">← Back to home</a>
        <h2 id="login-title">Log in to PawLink</h2>
        <p class="auth-subtitle">Pick up where you left off and see how you can help.</p>
        <form data-auth-form="login" novalidate>
          <label class="form-field"><span>Email address</span><input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label>
          <label class="form-field"><span>Password</span><input type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required></label>
          <p class="form-error" data-form-error role="alert" aria-live="polite"></p>
          <button class="button button-primary auth-submit" type="submit">Log In <span aria-hidden="true">→</span></button>
        </form>
        <p class="auth-footnote">New to PawLink? <a href="signup.html">Create an account</a></p>
      </div>
    </section>
  </main>
</body>
</html>
